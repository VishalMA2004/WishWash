services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wishwash
      POSTGRES_USER: wishwash
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishwash -d wishwash"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build:
      context: apps/api
    environment:
      WEATHER_BASE_URL: https://api.open-meteo.com/v1
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    ports:
      - "3000:3000"
volumes:
  postgres_data:
